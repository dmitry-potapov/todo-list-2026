<div class="root">
    <h1>Todo List</h1>
    <div>
        <input type="text" placeholder="Type a todo description here..." [formField]="todoForm.description" />
        <button [disabled]="descriptionEmpty()" (click)="saveTodo()">Save</button>
        <button [disabled]="descriptionEmpty()" (click)="clearSelection()">Clear</button>
    </div>
    <ul>
        @for (item of items(); track item.id) {
            <li>
                {{ item.description }}
                <button (click)="startEditingTodo(item)">Edit</button>
                <button (click)="deleteTodo(item)">Delete</button>
            </li>
        }
    </ul>
</div>
